<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Mi Empresa</title>
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      /* Estilos adicionales para el login */
      .login-container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem;
        min-height: 100vh;
        background: linear-gradient(135deg, #f0f2f5 0%, #e0e5ec 100%);
      }

      .login-box {
        background: white;
        padding: 3rem;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        width: 100%;
        max-width: 400px;
        transition: transform 0.3s;
      }

      .login-box:hover {
        transform: translateY(-5px);
      }

      .login-box .logo-icon {
        text-align: center;
        font-size: 4rem;
        margin-bottom: 0.5rem;
      }

      .login-box h2 {
        text-align: center;
        color: #1a1a2e;
        margin-bottom: 2rem;
        font-size: 1.8rem;
      }

      .login-box h2 span {
        color: #e94560;
      }

      .input-group {
        margin-bottom: 1.5rem;
      }

      .input-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: #333;
        font-weight: 500;
        font-size: 0.95rem;
      }

      .input-group input {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 1rem;
        transition: all 0.3s;
        background: #f8f9fa;
      }

      .input-group input:focus {
        border-color: #e94560;
        outline: none;
        background: white;
        box-shadow: 0 0 0 4px rgba(233, 69, 96, 0.1);
      }

      .input-group input::placeholder {
        color: #aaa;
      }

      .login-box button {
        width: 100%;
        padding: 0.9rem;
        background: linear-gradient(135deg, #e94560, #c23152);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 0.5rem;
      }

      .login-box button:hover {
        transform: scale(1.02);
        box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
      }

      .login-box button:active {
        transform: scale(0.98);
      }

      .error-message {
        margin-top: 1rem;
        text-align: center;
        font-weight: 500;
        min-height: 1.5rem;
      }

      .login-info {
        margin-top: 1.5rem;
        padding: 0.8rem;
        text-align: center;
        background: #f8f9fa;
        border-radius: 8px;
        color: #666;
        font-size: 0.9rem;
        border: 1px dashed #ddd;
      }

      .login-info strong {
        color: #1a1a2e;
      }

      .login-info .highlight {
        color: #e94560;
        font-weight: 700;
      }

      /* Responsive */
      @media (max-width: 480px) {
        .login-box {
          padding: 2rem 1.5rem;
        }

        .login-box h2 {
          font-size: 1.5rem;
        }

        .login-box .logo-icon {
          font-size: 3rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-box">
        <div class="logo-icon">🔐</div>
        <h2>Bienvenido a <span>Mi Empresa</span></h2>

        <form id="loginForm">
          <div class="input-group">
            <label for="username">👤 Usuario</label>
            <input
              type="text"
              id="username"
              placeholder="Ingresa tu usuario"
              required
              autofocus
            />
          </div>

          <div class="input-group">
            <label for="password">🔑 Contraseña</label>
            <input
              type="password"
              id="password"
              placeholder="Ingresa tu contraseña"
              required
            />
          </div>

          <button type="submit">Ingresar</button>
          <p id="mensaje-error" class="error-message"></p>
        </form>

        <div class="login-info">
          💡 <strong>Credenciales de prueba:</strong><br />
          Usuario: <span class="highlight">admin</span> | Contraseña:
          <span class="highlight">admin123</span>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Si ya hay sesión, redirigir al menú
        if (sessionStorage.getItem("userLogged") === "true") {
          window.location.href = "menu.html";
          return;
        }

        const form = document.getElementById("loginForm");
        const errorMsg = document.getElementById("mensaje-error");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");

        form.addEventListener("submit", function (e) {
          e.preventDefault();

          const username = usernameInput.value.trim();
          const password = passwordInput.value.trim();

          // Validar campos vacíos
          if (!username || !password) {
            errorMsg.textContent = "❌ Por favor completa todos los campos";
            errorMsg.style.color = "#e94560";
            return;
          }

          // Credenciales válidas
          if (username === "admin" && password === "admin123") {
            // Guardar sesión
            sessionStorage.setItem("userLogged", "true");
            sessionStorage.setItem("username", username);
            sessionStorage.setItem("loginTime", new Date().toLocaleString());

            // Redirigir al menú principal
            window.location.href = "menu.html";
          } else {
            errorMsg.textContent = "❌ Usuario o contraseña incorrectos";
            errorMsg.style.color = "#e94560";

            // Limpiar campos y enfocar
            passwordInput.value = "";
            passwordInput.focus();

            // Efecto de shake
            document.querySelector(".login-box").style.animation =
              "shake 0.5s ease";
            setTimeout(() => {
              document.querySelector(".login-box").style.animation = "";
            }, 500);
          }
        });

        // Permitir Enter para enviar
        document.addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            form.dispatchEvent(new Event("submit"));
          }
        });

        // Limpiar error al escribir
        usernameInput.addEventListener("input", function () {
          errorMsg.textContent = "";
        });

        passwordInput.addEventListener("input", function () {
          errorMsg.textContent = "";
        });
      });

      // Animación de shake (agregar al CSS global si se necesita)
      const style = document.createElement("style");
      style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                20% { transform: translateX(-10px); }
                40% { transform: translateX(10px); }
                60% { transform: translateX(-10px); }
                80% { transform: translateX(10px); }
            }
        `;
      document.head.appendChild(style);
    </script>
  </body>
</html>
